# Hostly starten:   docker compose up -d --build
# Logs ansehen:     docker compose logs -f web worker
services:
  # Website – hat KEINEN Docker-Zugriff
  web:
    build: .
    container_name: hostly-web
    restart: unless-stopped
    init: true
    # nur auf dem Mini-PC selbst erreichbar; nach außen geht es über Tailscale Funnel
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /srv/hostly:/srv/hostly:ro              # Server-Dateien nur lesen (Konsole, Downloads)
      - /srv/hostly/db:/srv/hostly/db           # Datenbank
      - /srv/hostly/uploads:/srv/hostly/uploads # Server-Icons, Profilbilder
    networks:
      - hostly-int
    mem_limit: 512m

  # worker – Zeitsteuerung, Docker, Archiv, Downloads
  worker:
    build: .
    container_name: hostly-worker
    restart: unless-stopped
    init: true
    command: ["python", "-m", "hostly.worker"]
    user: root
    volumes:
      - /srv/hostly:/srv/hostly
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      hostly-mc:
        ipv4_address: 172.30.0.2
    mem_limit: 384m
    cpus: 1.0               # Backups/ZIPs laufen langsam und leise
    stop_grace_period: 20s

  # playit.gg-Agenten (Minecraft von außen erreichbar). Starten nur, wenn in .env
  # COMPOSE_PROFILES=playit und die Schlüssel eingetragen sind (siehe docs/SETUP-MINI-PC.md).
  playit-1:
    image: ghcr.io/playit-cloud/playit-agent:0.16
    container_name: hostly-playit-1
    restart: unless-stopped
    profiles: ["playit"]
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_1:-}
    networks:
      hostly-mc:
        ipv4_address: 172.30.0.3
    mem_limit: 512m

  playit-2:
    image: ghcr.io/playit-cloud/playit-agent:0.16
    container_name: hostly-playit-2
    restart: unless-stopped
    profiles: ["playit2"]
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_2:-}
    networks:
      hostly-mc:
        ipv4_address: 172.30.0.4
    mem_limit: 512m

networks:
  hostly-int:
    name: hostly-int
  # Minecraft-Netz mit festen Tunnel-Plätzen (172.30.0.11, .12, …)
  hostly-mc:
    name: hostly-mc
    ipam:
      config:
        - subnet: 172.30.0.0/24
